[project]
name = "llm-eval-lab"
version = "0.1.0"
description = "Multi-backend LLM routing, observability, and evaluation lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deepeval>=2.5.5",
  "litellm>=1.90.0",
  "ollama>=0.6.2",
  "openai>=2.44.0",
  "python-dotenv>=1.2.2",
  "rich>=15.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
